<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>タスク＆タイムスケジュール管理</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDKs (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <style>
    :root {
      --slot-height: 20px;
      --hour-height: 80px;
    }
    body {
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }
    .timeline-lane {
      background-size: 100% 20px;
      background-image: 
        linear-gradient(to bottom, #e5e7eb 1px, transparent 1px),
        linear-gradient(to bottom, #f3f4f6 1px, transparent 1px),
        linear-gradient(to bottom, #f3f4f6 1px, transparent 1px),
        linear-gradient(to bottom, #f3f4f6 1px, transparent 1px);
      background-position: 0 0, 0 20px, 0 40px, 0 60px;
    }
    .task-card.completed {
      background-color: #f3f4f6 !important;
      border-left-color: #9ca3af !important;
      opacity: 0.75;
    }
    .task-card.completed .task-title-text {
      text-decoration: line-through;
      color: #6b7280;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col overflow-hidden select-none">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-gray-200 px-3 py-2 flex flex-wrap items-center justify-between gap-2 z-30 shadow-sm flex-shrink-0">
    <div class="flex items-center gap-2">
      <h1 class="text-sm sm:text-base font-bold flex items-center gap-1.5 text-gray-800">
        <i data-lucide="calendar-clock" class="w-4 h-4 sm:w-5 sm:h-5 text-blue-600"></i> PlanSync
      </h1>
      <div class="bg-indigo-50 p-0.5 sm:p-1 rounded-lg flex gap-0.5 sm:gap-1">
        <button id="viewBtnDaily" onclick="switchView('daily')" class="px-2 sm:px-3 py-1 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition">日別</button>
        <button id="viewBtnCalendar" onclick="switchView('calendar')" class="px-2 sm:px-3 py-1 text-xs font-semibold rounded-md text-gray-600 hover:text-blue-600 transition">月間</button>
        <button id="viewBtnMatrix" onclick="switchView('matrix')" class="px-2 sm:px-3 py-1 text-xs font-semibold rounded-md text-gray-600 hover:text-blue-600 transition">分類</button>
      </div>
    </div>

    <div class="flex items-center gap-1 flex-wrap">
      <span id="syncBadge" class="hidden text-[10px] bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded-full border border-emerald-300 items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> 同期中: <span id="syncKeyDisplay"></span>
      </span>

      <button onclick="exportData()" class="px-1.5 py-1 text-xs bg-gray-100 text-gray-700 border border-gray-300 rounded-md hover:bg-gray-200 flex items-center gap-1 font-medium" title="ファイル保存">
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
      </button>
      <label class="px-1.5 py-1 text-xs bg-gray-100 text-gray-700 border border-gray-300 rounded-md hover:bg-gray-200 flex items-center gap-1 font-medium cursor-pointer" title="ファイル読込">
        <i data-lucide="upload" class="w-3.5 h-3.5"></i>
        <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">
      </label>

      <button onclick="openSyncModal()" class="px-2 py-1 text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md hover:bg-emerald-100 flex items-center gap-1 font-medium">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i> 同期
      </button>
      <button onclick="openRoutineModal()" class="px-2 py-1 text-xs bg-purple-50 text-purple-700 border border-purple-200 rounded-md hover:bg-purple-100 flex items-center gap-1 font-medium">
        <i data-lucide="repeat" class="w-3.5 h-3.5"></i> 定例
      </button>

      <div class="flex items-center gap-0.5 bg-gray-50 border border-gray-200 rounded-md p-0.5">
        <button onclick="changeDate(-1)" class="p-1 hover:bg-gray-200 rounded text-gray-600"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button>
        <input type="date" id="datePicker" class="text-xs bg-transparent border-none outline-none font-medium px-0.5 text-gray-700 w-24 sm:w-auto" onchange="onDatePickerChange(this.value)">
        <button onclick="changeDate(1)" class="p-1 hover:bg-gray-200 rounded text-gray-600"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button>
        <button onclick="goToToday()" class="text-[10px] sm:text-xs px-1.5 py-0.5 bg-white border border-gray-200 rounded text-gray-600 hover:bg-gray-50 font-medium">今日</button>
      </div>
    </div>
  </header>

  <!-- モバイルタブ -->
  <div id="mobileTabBar" class="sm:hidden flex bg-white border-b border-gray-200 w-full flex-shrink-0">
    <button id="mobTabSched" onclick="switchMobileTab('schedule')" class="flex-1 py-1.5 text-center text-xs font-semibold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50">タイムライン</button>
    <button id="mobTabInbox" onclick="switchMobileTab('inbox')" class="flex-1 py-1.5 text-center text-xs font-semibold text-gray-500 border-b-2 border-transparent">タスクBOX</button>
  </div>

  <!-- メインコンテナ -->
  <div class="flex-1 relative overflow-hidden flex">

    <!-- デイリー VIEW -->
    <div id="dailyView" class="w-full h-full flex flex-col sm:flex-row">
      <div id="scheduleArea" class="flex-1 flex flex-col bg-white border-r border-gray-200 h-full overflow-hidden">
        <div class="grid grid-cols-[55px_1fr_1fr] bg-gray-50 border-b border-gray-200 text-xs font-bold text-center divide-x divide-gray-200 py-1.5 flex-shrink-0">
          <div class="text-gray-500 flex items-center justify-center"><i data-lucide="clock" class="w-3.5 h-3.5"></i></div>
          <div class="text-blue-600 flex items-center justify-center gap-1">
            計画 (Plan) <span id="planTotal" class="text-[10px] font-normal bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded-full">0h 0m</span>
          </div>
          <div class="text-emerald-600 flex items-center justify-center gap-1">
            実績 (Actual) <span id="actTotal" class="text-[10px] font-normal bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded-full">0h 0m</span>
          </div>
        </div>

        <div id="timelineScroll" class="flex-1 overflow-y-auto relative">
          <div class="grid grid-cols-[55px_1fr_1fr] relative min-h-[1920px]">
            <div id="timeLabels" class="border-r border-gray-200 bg-gray-50/50 text-xs text-gray-400 text-center select-none"></div>
            <div id="planLane" data-lane="plan" class="timeline-lane relative border-r border-gray-200 h-full"></div>
            <div id="actLane" data-lane="actual" class="timeline-lane relative h-full"></div>
          </div>
        </div>
      </div>

      <!-- インボックス -->
      <div id="inboxArea" class="hidden sm:flex w-full sm:w-80 bg-gray-50 flex-col border-l border-gray-200 h-full overflow-hidden">
        <div class="p-3 border-b border-gray-200 bg-white flex-shrink-0">
          <div class="text-xs font-bold text-gray-700 mb-1.5 flex justify-between items-center">
            <span>タスク・インボックス</span>
            <span class="text-[10px] font-normal text-gray-400">Ctrl+ドラッグで複製</span>
          </div>
          <form onsubmit="handleAddTask(event)" class="flex flex-col gap-1.5">
            <input type="text" id="newTaskTitle" placeholder="新しいタスク名..." required class="text-xs p-1.5 border border-gray-300 rounded-md outline-none focus:border-blue-500">
            <div class="flex gap-1">
              <select id="newTaskCategory" class="text-xs p-1 border border-gray-300 rounded-md bg-white outline-none">
                <option value="desk">🖥️ デスク</option>
                <option value="meeting">👥 会議</option>
                <option value="field">👷 現場</option>
              </select>
              <select id="newTaskDuration" class="text-xs p-1 border border-gray-300 rounded-md bg-white outline-none">
                <option value="15">15分</option>
                <option value="30" selected>30分</option>
                <option value="45">45分</option>
                <option value="60">1時間</option>
                <option value="90">1.5h</option>
                <option value="120">2h</option>
              </select>
              <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-1 rounded-md transition">+ 追加</button>
            </div>
            <select id="newTaskMatrixZone" class="text-[10px] p-1 border border-gray-200 rounded bg-gray-50 text-gray-600 outline-none">
              <option value="none">優先度: 未設定 (未整理)</option>
              <option value="q1">Q1: 重要 × 緊急 (すぐやる)</option>
              <option value="q2">Q2: 重要 × 非緊急 (計画する)</option>
              <option value="q3">Q3: 非重要 × 緊急 (任せる)</option>
              <option value="q4">Q4: 非重要 × 非緊急 (やめる)</option>
            </select>
          </form>
        </div>
        <div id="inboxList" data-lane="inbox" class="flex-1 p-2.5 overflow-y-auto flex flex-col gap-2 min-h-0"></div>
      </div>
    </div>

    <!-- カレンダー VIEW -->
    <div id="calendarView" class="hidden w-full h-full bg-white flex-col p-3 overflow-y-auto">
      <div class="flex justify-between items-center mb-3">
        <div class="flex items-center gap-2">
          <button onclick="changeCalendarMonth(-1)" class="p-1 hover:bg-gray-100 rounded border border-gray-200 text-gray-600"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
          <h2 id="calendarMonthTitle" class="text-base sm:text-lg font-bold text-gray-800 min-w-[100px] text-center"></h2>
          <button onclick="changeCalendarMonth(1)" class="p-1 hover:bg-gray-100 rounded border border-gray-200 text-gray-600"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
        </div>
        <button onclick="openCalendarModal()" class="px-2.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-md flex items-center gap-1">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> 大枠予定
        </button>
      </div>
      <div id="calendarGrid" class="grid grid-cols-7 border-t border-l border-gray-200 rounded-lg overflow-hidden flex-1"></div>
    </div>

    <!-- マトリクス VIEW -->
    <div id="matrixView" class="hidden w-full h-full bg-gray-100 flex-col p-3 overflow-y-auto">
      <div class="mb-2 bg-white p-2.5 rounded-lg border border-gray-200 shadow-sm flex flex-col gap-1.5">
        <div class="flex justify-between items-center">
          <span class="text-xs font-bold text-gray-700 flex items-center gap-1">
            <i data-lucide="inbox" class="w-3.5 h-3.5 text-indigo-500"></i> 未整理タスクトレイ (単発・未完了・未配置タスク)
          </span>
          <span class="text-[10px] text-gray-400">タップ/ドラッグで配置</span>
        </div>
        <div id="matrixInboxTray" class="flex items-center gap-2 overflow-x-auto min-h-[38px] p-1 bg-gray-50 rounded border border-dashed border-gray-300"></div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 flex-1 min-h-[450px]">
        <div class="bg-red-50/50 border border-red-200 rounded-lg p-2.5 flex flex-col min-h-[180px]">
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs font-bold text-red-700 flex items-center gap-1"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i> Q1: 第1領域 (重要 × 緊急)</span>
            <button onclick="quickAddMatrixTask('q1')" class="text-[10px] bg-red-100 hover:bg-red-200 text-red-800 font-bold px-1.5 py-0.5 rounded">+ 追加</button>
          </div>
          <div id="matrixZoneQ1" data-zone="q1" class="matrix-zone flex-1 flex flex-col gap-1.5 overflow-y-auto p-1 border border-dashed border-red-200 rounded bg-white/50"></div>
        </div>
        <div class="bg-blue-50/50 border border-blue-200 rounded-lg p-2.5 flex flex-col min-h-[180px]">
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs font-bold text-blue-700 flex items-center gap-1"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> Q2: 第2領域 (重要 × 非緊急)</span>
            <button onclick="quickAddMatrixTask('q2')" class="text-[10px] bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold px-1.5 py-0.5 rounded">+ 追加</button>
          </div>
          <div id="matrixZoneQ2" data-zone="q2" class="matrix-zone flex-1 flex flex-col gap-1.5 overflow-y-auto p-1 border border-dashed border-blue-200 rounded bg-white/50"></div>
        </div>
        <div class="bg-amber-50/50 border border-amber-200 rounded-lg p-2.5 flex flex-col min-h-[180px]">
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs font-bold text-amber-700 flex items-center gap-1"><i data-lucide="user-check" class="w-3.5 h-3.5"></i> Q3: 第3領域 (非重要 × 緊急)</span>
            <button onclick="quickAddMatrixTask('q3')" class="text-[10px] bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-1.5 py-0.5 rounded">+ 追加</button>
          </div>
          <div id="matrixZoneQ3" data-zone="q3" class="matrix-zone flex-1 flex flex-col gap-1.5 overflow-y-auto p-1 border border-dashed border-amber-200 rounded bg-white/50"></div>
        </div>
        <div class="bg-gray-100 border border-gray-300 rounded-lg p-2.5 flex flex-col min-h-[180px]">
          <div class="flex justify-between items-center mb-1.5">
            <span class="text-xs font-bold text-gray-600 flex items-center gap-1"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Q4: 第4領域 (非重要 × 非緊急)</span>
            <button onclick="quickAddMatrixTask('q4')" class="text-[10px] bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold px-1.5 py-0.5 rounded">+ 追加</button>
          </div>
          <div id="matrixZoneQ4" data-zone="q4" class="matrix-zone flex-1 flex flex-col gap-1.5 overflow-y-auto p-1 border border-dashed border-gray-300 rounded bg-white/50"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- クイック操作バー -->
  <div id="quickActionBar" class="hidden fixed bottom-3 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-3 py-1.5 rounded-full items-center gap-2 shadow-2xl z-50 text-xs">
    <button onclick="quickEditTitle()" class="flex flex-col items-center text-[9px]"><span>✏️</span>タイトル</button>
    <button onclick="quickResize(-15)" class="flex flex-col items-center text-[9px]"><span>➖</span>15分縮</button>
    <button onclick="quickResize(15)" class="flex flex-col items-center text-[9px]"><span>➕</span>15分拡</button>
    <button onclick="openTimeEditModalForSelected()" class="flex flex-col items-center text-[9px]"><span>⏰</span>時間</button>
    <button onclick="quickToggleCategoryPicker()" class="flex flex-col items-center text-[9px]"><span>🏷️</span>種類</button>
    <button onclick="quickDuplicate()" class="flex flex-col items-center text-[9px]"><span>📋</span>複製</button>
    <button onclick="quickDelete()" class="flex flex-col items-center text-[9px] text-red-400"><span>🗑️</span>削除</button>
    <button onclick="closeQuickAction()" class="flex flex-col items-center text-[9px] text-gray-400"><span>✖</span>閉じる</button>
  </div>

  <!-- モーダル各種 -->
  <div id="timeEditModal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-lg p-4 w-full max-w-xs shadow-xl flex flex-col gap-3">
      <h3 class="text-sm font-bold text-gray-800">⏰ 開始・終了時間の変更</h3>
      <input type="hidden" id="timeEditTaskId">
      <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500 font-medium">開始時間</label>
        <input type="time" id="timeEditStart" step="900" class="p-1.5 border border-gray-300 rounded text-xs outline-none">
      </div>
      <div class="flex flex-col gap-1">
        <label class="text-xs text-gray-500 font-medium">終了時間</label>
        <input type="time" id="timeEditEnd" step="900" class="p-1.5 border border-gray-300 rounded text-xs outline-none">
      </div>
      <div class="flex justify-end gap-2 mt-1">
        <button onclick="closeTimeEditModal()" class="px-3 py-1 bg-gray-100 text-xs rounded text-gray-600">キャンセル</button>
        <button onclick="saveTimeEditModal()" class="px-3 py-1 bg-blue-600 text-xs text-white rounded font-bold">保存</button>
      </div>
    </div>
  </div>

  <div id="calendarModal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-lg p-4 w-full max-w-xs shadow-xl flex flex-col gap-3">
      <h3 class="text-sm font-bold text-gray-800">📅 カレンダー大枠予定を追加</h3>
      <form onsubmit="handleSaveCalendarEvent(event)" class="flex flex-col gap-2.5">
        <input type="text" id="calEventTitle" placeholder="例: 全体戦略会議" required class="p-2 border border-gray-300 rounded text-xs">
        <div class="flex gap-1.5">
          <select id="calEventCategory" class="p-1.5 border border-gray-300 rounded text-xs flex-1 bg-white">
            <option value="meeting">👥 会議・打合せ</option>
            <option value="desk">🖥️ デスクワーク</option>
            <option value="field">👷 現場仕事</option>
          </select>
          <input type="date" id="calEventDate" required class="p-1.5 border border-gray-300 rounded text-xs flex-1">
        </div>
        <div class="flex gap-1.5">
          <input type="time" id="calEventStart" step="900" value="10:00" required class="p-1.5 border border-gray-300 rounded text-xs flex-1">
          <input type="time" id="calEventEnd" step="900" value="12:00" required class="p-1.5 border border-gray-300 rounded text-xs flex-1">
        </div>
        <div class="flex justify-end gap-2 mt-1">
          <button type="button" onclick="closeCalendarModal()" class="px-3 py-1 bg-gray-100 text-xs rounded text-gray-600">キャンセル</button>
          <button type="submit" class="px-3 py-1 bg-blue-600 text-xs text-white rounded font-bold">登録</button>
        </div>
      </form>
    </div>
  </div>

  <div id="routineModal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-lg p-4 w-full max-w-sm shadow-xl flex flex-col gap-2.5 max-h-[85vh]">
      <h3 class="text-sm font-bold text-gray-800 flex items-center gap-1"><i data-lucide="repeat" class="w-4 h-4 text-purple-600"></i> ルーティンワークの設定</h3>
      <form onsubmit="handleAddRoutine(event)" class="flex flex-col gap-2 border-b border-gray-200 pb-2.5">
        <input type="text" id="rtTitle" placeholder="例: 朝礼・定例ミーティング" required class="p-1.5 border border-gray-300 rounded text-xs">
        <div class="flex gap-1.5">
          <input type="time" id="rtStart" value="09:00" required class="p-1.5 border border-gray-300 rounded text-xs flex-1">
          <input type="time" id="rtEnd" value="09:30" required class="p-1.5 border border-gray-300 rounded text-xs flex-1">
        </div>
        <div class="flex flex-col gap-1">
          <div class="flex justify-between items-center text-xs font-semibold text-gray-600">
            <span>繰り返し曜日</span>
            <div class="flex gap-2 text-[10px]">
              <button type="button" onclick="selectAllDays(true)" class="text-blue-600 hover:underline">全選択</button>
              <button type="button" onclick="selectAllDays(false)" class="text-gray-400 hover:underline">クリア</button>
            </div>
          </div>
          <div class="flex justify-between items-center gap-1 bg-gray-50 p-1 border border-gray-200 rounded">
            <label class="flex flex-col items-center text-[10px] text-gray-600 cursor-pointer">
              <span>日</span><input type="checkbox" value="0" class="rt-day-cb accent-purple-600">
            </label>
            <label class="flex flex-col items-center text-[10px] text-gray-600 cursor-pointer">
              <span>月</span><input type="checkbox" value="1" class="rt-day-cb accent-purple-600" checked>
            </label>
            <label class="flex flex-col items-center text-[10px] text-gray-600 cursor-pointer">
              <span>火</span><input type="checkbox" value="2" class="rt-day-cb accent-purple-600" checked>
            </label>
            <label class="flex flex-col items-center text-[10px] text-gray-600 cursor-pointer">
              <span>水</span><input type="checkbox" value="3" class="rt-day-cb accent-purple-600" checked>
            </label>
            <label class="flex flex-col items-center text-[10px] text-gray-600 cursor-pointer">
              <span>木</span><input type="checkbox" value="4" class="rt-day-cb accent-purple-600" checked>
            </label>
            <label class="flex flex-col items-center text-[10px] text-gray-600 cursor-pointer">
              <span>金</span><input type="checkbox" value="5" class="rt-day-cb accent-purple-600" checked>
            </label>
            <label class="flex flex-col items-center text-[10px] text-gray-600 cursor-pointer">
              <span>土</span><input type="checkbox" value="6" class="rt-day-cb accent-purple-600">
            </label>
          </div>
        </div>
        <select id="rtCategory" class="p-1.5 border border-gray-300 rounded text-xs bg-white">
          <option value="desk">🖥️ デスク</option>
          <option value="meeting">👥 会議</option>
          <option value="field">👷 現場</option>
        </select>
        <button type="submit" class="bg-purple-600 text-white font-bold text-xs py-1 rounded hover:bg-purple-700 transition mt-0.5">+ ルーティンを登録</button>
      </form>
      <div id="routineList" class="flex flex-col gap-1.5 overflow-y-auto max-h-40 pr-1"></div>
      <div class="flex justify-end mt-1">
        <button onclick="closeRoutineModal()" class="px-3 py-1 bg-gray-200 text-xs rounded text-gray-700">閉じる</button>
      </div>
    </div>
  </div>

  <div id="syncModal" class="hidden fixed inset-0 bg-black/40 z-50 items-center justify-center p-4">
    <div class="bg-white rounded-lg p-4 w-full max-w-xs shadow-xl flex flex-col gap-3">
      <h3 class="text-sm font-bold text-gray-800 flex items-center gap-1"><i data-lucide="refresh-cw" class="w-4 h-4 text-emerald-600"></i> 端末同期の設定</h3>
      <p class="text-xs text-gray-500">任意のあい言葉（同期キー）を入力すると、同じキーを入力した端末同士で自動同期できます。</p>
      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-gray-700">同期キー (例: my-team-2026)</label>
        <input type="text" id="syncKeyInput" placeholder="例: team-schedule-2026" class="p-2 border border-gray-300 rounded text-xs outline-none">
      </div>
      <div class="flex justify-end gap-2 mt-1">
        <button onclick="closeSyncModal()" class="px-3 py-1 bg-gray-100 text-xs rounded text-gray-600">キャンセル</button>
        <button onclick="applySyncKey()" class="px-3 py-1 bg-emerald-600 text-xs text-white rounded font-bold">同期に接続</button>
      </div>
    </div>
  </div>

  <!-- スクリプト -->
  <script>
    const SLOT_HEIGHT = 20;
    const CATEGORY_MAP = {
      desk: { label: 'デスク', icon: '💻', color: 'bg-blue-100 text-blue-800', border: '#3b82f6' },
      meeting: { label: '会議', icon: '👥', color: 'bg-purple-100 text-purple-800', border: '#8b5cf6' },
      field: { label: '現場', icon: '👷', color: 'bg-amber-100 text-amber-800', border: '#f59e0b' }
    };
    const DAY_NAMES = ['日', '月', '火', '水', '木', '金', '土'];

    let state = {
      currentDateStr: getTodayStr(),
      currentView: 'daily',
      tasks: [],
      calendarEvents: [],
      routines: [],
      selectedTaskId: null,
      isCtrlPressed: false,
      syncKey: localStorage.getItem('ts_sync_key') || null
    };

    let dbRef = null;
    let isRemoteUpdating = false;

    window.addEventListener('DOMContentLoaded', () => {
      initFirebase();
      loadStorageData();
      initTimeLabels();
      updateDateDisplay();
      setupDropZones();
      renderAll();
      lucide.createIcons();

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Control' || e.key === 'Meta') {
          state.isCtrlPressed = true;
          toggleCopyBadges(true);
        }
      });
      window.addEventListener('keyup', (e) => {
        if (e.key === 'Control' || e.key === 'Meta') {
          state.isCtrlPressed = false;
          toggleCopyBadges(false);
        }
      });
    });

    function getTodayStr() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    // エクスポート / インポート
    function exportData() {
      const exportObj = {
        version: "1.0",
        exportDate: new Date().toISOString(),
        tasks: state.tasks,
        calendarEvents: state.calendarEvents,
        routines: state.routines
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `plansync_backup_${getTodayStr()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(event) {
      const fileReader = new FileReader();
      const file = event.target.files[0];
      if (!file) return;

      fileReader.onload = (e) => {
        try {
          const parsedData = JSON.parse(e.target.result);
          if (parsedData.tasks) state.tasks = parsedData.tasks;
          if (parsedData.calendarEvents) state.calendarEvents = parsedData.calendarEvents;
          if (parsedData.routines) state.routines = parsedData.routines;

          renderAll();
          alert('履歴データを正常に読み込みました！');
        } catch (err) {
          alert('JSONファイルの読み込みに失敗しました。');
        }
        event.target.value = '';
      };
      fileReader.readAsText(file);
    }

    // Firebase 接続制御
    function initFirebase() {
      const firebaseConfig = {
        databaseURL: "https://my-plansync-default-rtdb.asia-southeast1.firebasedatabase.app"
      };
      if (!firebase.apps.length) {
        try { firebase.initializeApp(firebaseConfig); } catch(e){ console.error(e); }
      }
      if (state.syncKey) {
        connectFirebaseSync(state.syncKey);
      }
    }

    function connectFirebaseSync(key) {
      if (!key) return;
      try {
        const sanitizedKey = key.replace(/[.#$/\[\]]/g, '_');
        if (dbRef) dbRef.off();

        dbRef = firebase.database().ref('schedules/' + sanitizedKey);
        
        const badge = document.getElementById('syncBadge');
        badge.classList.remove('hidden');
        badge.classList.add('flex');
        document.getElementById('syncKeyDisplay').textContent = key;

        dbRef.on('value', (snapshot) => {
          const val = snapshot.val();
          if (val) {
            isRemoteUpdating = true;
            state.tasks = val.tasks || [];
            state.calendarEvents = val.calendarEvents || [];
            state.routines = val.routines || [];
            renderAll(true);
            isRemoteUpdating = false;
          }
        }, (error) => {
          console.error("Firebase Realtime Database Error:", error);
        });
      } catch(e) { console.error('Firebase Connect failed', e); }
    }

    function loadStorageData() {
      const savedTasks = localStorage.getItem('ts_tasks');
      const savedCal = localStorage.getItem('ts_calendar');
      const savedRt = localStorage.getItem('ts_routines');

      if (savedTasks !== null) state.tasks = JSON.parse(savedTasks);
      if (savedCal !== null) state.calendarEvents = JSON.parse(savedCal);
      if (savedRt !== null) state.routines = JSON.parse(savedRt);
    }

    function saveData() {
      localStorage.setItem('ts_tasks', JSON.stringify(state.tasks));
      localStorage.setItem('ts_calendar', JSON.stringify(state.calendarEvents));
      localStorage.setItem('ts_routines', JSON.stringify(state.routines));

      if (dbRef && !isRemoteUpdating) {
        dbRef.set({
          tasks: state.tasks,
          calendarEvents: state.calendarEvents,
          routines: state.routines
        }).catch(err => console.error("Firebase Write Error:", err));
      }
    }

    function initTimeLabels() {
      const container = document.getElementById('timeLabels');
      container.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const div = document.createElement('div');
        div.className = 'h-[80px] border-b border-gray-200 pt-1 text-[11px] font-medium text-gray-400';
        div.textContent = `${String(h).padStart(2, '0')}:00`;
        container.appendChild(div);
      }
    }

    function updateDateDisplay() {
      document.getElementById('datePicker').value = state.currentDateStr;
    }

    function changeDate(delta) {
      const d = new Date(state.currentDateStr);
      d.setDate(d.getDate() + delta);
      state.currentDateStr = d.toISOString().split('T')[0];
      updateDateDisplay();
      renderAll();
    }

    function changeCalendarMonth(delta) {
      const d = new Date(state.currentDateStr);
      d.setMonth(d.getMonth() + delta);
      state.currentDateStr = d.toISOString().split('T')[0];
      updateDateDisplay();
      renderAll();
    }

    function goToToday() {
      state.currentDateStr = getTodayStr();
      updateDateDisplay();
      renderAll();
    }

    function onDatePickerChange(val) {
      if (!val) return;
      state.currentDateStr = val;
      renderAll();
    }

    function switchView(view) {
      state.currentView = view;
      ['Daily', 'Calendar', 'Matrix'].forEach(v => {
        const btn = document.getElementById(`viewBtn${v}`);
        if (v.toLowerCase() === view) {
          btn.className = "px-2 sm:px-3 py-1 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition";
        } else {
          btn.className = "px-2 sm:px-3 py-1 text-xs font-semibold rounded-md text-gray-600 hover:text-blue-600 transition";
        }
      });

      document.getElementById('dailyView').style.display = view === 'daily' ? 'flex' : 'none';
      document.getElementById('calendarView').style.display = view === 'calendar' ? 'flex' : 'none';
      document.getElementById('matrixView').style.display = view === 'matrix' ? 'flex' : 'none';

      if (view === 'calendar') renderCalendarView();
      if (view === 'matrix') renderMatrixView();
    }

    function switchMobileTab(tab) {
      const isSched = tab === 'schedule';
      const schedArea = document.getElementById('scheduleArea');
      const inboxArea = document.getElementById('inboxArea');

      if (isSched) {
        schedArea.style.display = 'flex';
        inboxArea.classList.add('hidden');
        inboxArea.classList.remove('flex');
        document.getElementById('mobTabSched').className = "flex-1 py-1.5 text-center text-xs font-semibold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50";
        document.getElementById('mobTabInbox').className = "flex-1 py-1.5 text-center text-xs font-semibold text-gray-500 border-b-2 border-transparent";
      } else {
        schedArea.style.display = 'none';
        inboxArea.classList.remove('hidden');
        inboxArea.classList.add('flex');
        document.getElementById('mobTabSched').className = "flex-1 py-1.5 text-center text-xs font-semibold text-gray-500 border-b-2 border-transparent";
        document.getElementById('mobTabInbox').className = "flex-1 py-1.5 text-center text-xs font-semibold text-blue-600 border-b-2 border-blue-600 bg-blue-50/50";
      }
    }

    function syncCalendarAndRoutines() {
      const cEvents = state.calendarEvents.filter(e => e.date === state.currentDateStr);
      cEvents.forEach(ce => {
        if (!state.tasks.some(t => t.calendarEventId === ce.id)) {
          state.tasks.push({
            id: 'task_cal_' + ce.id,
            calendarEventId: ce.id,
            title: ce.title,
            duration: ce.duration,
            date: ce.date,
            lane: 'plan',
            topMinutes: ce.startMinutes,
            category: ce.category || 'meeting',
            completed: false,
            matrixZone: 'q1',
            isCalendarEvent: true
          });
        }
      });

      const currD = new Date(state.currentDateStr);
      const dayOfWeek = currD.getDay();

      state.routines.forEach(rt => {
        const days = rt.days || [1, 2, 3, 4, 5];
        if (days.includes(dayOfWeek)) {
          const rtTaskId = `task_rt_${rt.id}_${state.currentDateStr}`;
          if (!state.tasks.some(t => t.id === rtTaskId)) {
            state.tasks.push({
              id: rtTaskId,
              title: rt.title,
              duration: rt.duration,
              date: state.currentDateStr,
              lane: 'plan',
              topMinutes: rt.startMinutes,
              category: rt.category || 'desk',
              completed: false,
              matrixZone: 'q2',
              isRoutine: true
            });
          }
        }
      });
    }

    function renderAll(skipSave = false) {
      syncCalendarAndRoutines();
      renderTimelineTasks();
      renderInboxTasks();
      calculateTotals();
      if (state.currentView === 'calendar') renderCalendarView();
      if (state.currentView === 'matrix') renderMatrixView();
      if (!skipSave) saveData();
    }

    function renderTimelineTasks() {
      const planLane = document.getElementById('planLane');
      const actLane = document.getElementById('actLane');
      planLane.innerHTML = '';
      actLane.innerHTML = '';

      const dayTasks = state.tasks.filter(t => t.date === state.currentDateStr && (t.lane === 'plan' || t.lane === 'actual'));

      dayTasks.forEach(task => {
        const card = createTaskCardElement(task);
        card.style.top = `${(task.topMinutes / 15) * SLOT_HEIGHT}px`;
        card.style.height = `${(task.duration / 15) * SLOT_HEIGHT}px`;

        if (task.lane === 'plan') planLane.appendChild(card);
        else if (task.lane === 'actual') actLane.appendChild(card);
      });
    }

    function renderInboxTasks() {
      const inboxList = document.getElementById('inboxList');
      inboxList.innerHTML = '';

      const inboxTasks = state.tasks.filter(t => t.lane === 'inbox');
      inboxTasks.forEach(task => {
        const card = createTaskCardElement(task);
        card.style.height = 'auto';
        inboxList.appendChild(card);
      });
    }

    function createTaskCardElement(task) {
      const card = document.createElement('div');
      const catInfo = CATEGORY_MAP[task.category] || CATEGORY_MAP.desk;

      card.className = `task-card absolute left-1 right-1 bg-white border-l-4 rounded shadow-sm p-1.5 text-xs flex flex-col justify-between cursor-grab select-none overflow-visible transition-all ${task.completed ? 'completed' : ''}`;
      card.style.borderLeftColor = catInfo.border;
      card.dataset.id = task.id;
      card.draggable = true;

      card.addEventListener('dragstart', handleDragStart);
      card.addEventListener('dragend', handleDragEnd);
      card.addEventListener('click', (e) => { e.stopPropagation(); selectTask(task.id); });

      const showCheckbox = task.lane !== 'plan';

      card.innerHTML = `
        <div class="flex items-center gap-1 w-full">
          ${showCheckbox ? `<input type="checkbox" ${task.completed ? 'checked' : ''} class="task-checkbox rounded border-gray-300 text-blue-600 focus:ring-0 cursor-pointer" onclick="event.stopPropagation(); toggleTaskComplete('${task.id}', this.checked)">` : ''}
          <span class="task-title-text font-bold text-gray-800 truncate flex-1">${task.title}</span>
          <span class="text-[9px] px-1 rounded ${catInfo.color}">${catInfo.icon}</span>
          ${task.matrixZone && task.matrixZone !== 'none' ? `<span class="text-[9px] bg-gray-100 font-bold px-1 rounded text-gray-600">${task.matrixZone.toUpperCase()}</span>` : ''}
          <button onclick="event.stopPropagation(); openTimeEditModal('${task.id}')" class="text-gray-400 hover:text-gray-600 text-[10px]">⏰</button>
          <button onclick="event.stopPropagation(); deleteTask('${task.id}')" class="text-gray-400 hover:text-red-500 text-[10px]">✕</button>
        </div>
        ${task.lane !== 'inbox' ? `
          <div class="text-[10px] text-gray-400 flex justify-between items-center mt-0.5">
            <span>${formatMinutesToTime(task.topMinutes)} - ${formatMinutesToTime(task.topMinutes + task.duration)} (${task.duration}分)</span>
          </div>
          <div class="resize-handle absolute bottom-0 left-0 right-0 h-1.5 cursor-ns-resize hover:bg-blue-400/50"></div>
        ` : ''}
        ${state.isCtrlPressed ? `<div class="absolute -top-2 -right-2 bg-red-500 text-white text-[9px] px-1 rounded-full font-bold shadow">+ 複製</div>` : ''}
      `;

      if (task.lane !== 'inbox') {
        const handle = card.querySelector('.resize-handle');
        if (handle) {
          handle.addEventListener('mousedown', (e) => initResize(e, task.id));
        }
      }

      return card;
    }

    function formatMinutesToTime(mins) {
      const h = String(Math.floor(mins / 60)).padStart(2, '0');
      const m = String(mins % 60).padStart(2, '0');
      return `${h}:${m}`;
    }

    function handleAddTask(e) {
      e.preventDefault();
      const title = document.getElementById('newTaskTitle').value.trim();
      const dur = parseInt(document.getElementById('newTaskDuration').value, 10);
      const cat = document.getElementById('newTaskCategory').value;
      const zone = document.getElementById('newTaskMatrixZone').value;

      state.tasks.push({
        id: 'task_' + Date.now(),
        title,
        duration: dur,
        category: cat,
        matrixZone: zone,
        date: state.currentDateStr,
        lane: 'inbox',
        topMinutes: 540,
        completed: false
      });

      document.getElementById('newTaskTitle').value = '';
      renderAll();
    }

    function deleteTask(taskId) {
      state.tasks = state.tasks.filter(t => t.id !== taskId);
      renderAll();
    }

    function toggleTaskComplete(taskId, completed) {
      const t = state.tasks.find(x => x.id === taskId);
      if (t) { t.completed = completed; renderAll(); }
    }

    let draggedTaskId = null;
    function handleDragStart(e) {
      draggedTaskId = this.dataset.id;
      e.dataTransfer.setData('text/plain', draggedTaskId);
      e.dataTransfer.effectAllowed = state.isCtrlPressed ? 'copy' : 'move';
    }
    function handleDragEnd() { draggedTaskId = null; }

    function setupDropZones() {
      const zones = [
        document.getElementById('planLane'),
        document.getElementById('actLane'),
        document.getElementById('inboxList'),
        ...document.querySelectorAll('.matrix-zone')
      ];

      zones.forEach(z => {
        z.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = state.isCtrlPressed ? 'copy' : 'move';
        });

        z.addEventListener('drop', (e) => {
          e.preventDefault();
          const id = e.dataTransfer.getData('text/plain') || draggedTaskId;
          const task = state.tasks.find(t => t.id === id);
          if (!task) return;

          const matrixZone = z.dataset.zone;
          const lane = z.dataset.lane;

          if (state.isCtrlPressed) {
            const copyTask = JSON.parse(JSON.stringify(task));
            copyTask.id = 'task_' + Date.now();
            if (matrixZone) {
              copyTask.matrixZone = matrixZone;
            } else if (lane) {
              copyTask.lane = lane;
              copyTask.date = state.currentDateStr;
              if (lane !== 'inbox') {
                const rect = z.getBoundingClientRect();
                const offsetY = e.clientY - rect.top;
                copyTask.topMinutes = Math.max(0, Math.floor(offsetY / SLOT_HEIGHT) * 15);
              }
            }
            state.tasks.push(copyTask);
          } else {
            if (matrixZone) {
              task.matrixZone = matrixZone;
            } else if (lane) {
              task.lane = lane;
              task.date = state.currentDateStr;
              if (lane !== 'inbox') {
                const rect = z.getBoundingClientRect();
                const offsetY = e.clientY - rect.top;
                task.topMinutes = Math.max(0, Math.floor(offsetY / SLOT_HEIGHT) * 15);
              }
            }
          }
          renderAll();
        });
      });
    }

    function toggleCopyBadges(show) { renderAll(); }

    function openTimeEditModal(taskId) {
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      document.getElementById('timeEditTaskId').value = taskId;
      document.getElementById('timeEditStart').value = formatMinutesToTime(task.topMinutes);
      document.getElementById('timeEditEnd').value = formatMinutesToTime(task.topMinutes + task.duration);
      document.getElementById('timeEditModal').style.display = 'flex';
    }
    function closeTimeEditModal() { document.getElementById('timeEditModal').style.display = 'none'; }
    function saveTimeEditModal() {
      const id = document.getElementById('timeEditTaskId').value;
      const startStr = document.getElementById('timeEditStart').value;
      const endStr = document.getElementById('timeEditEnd').value;
      const task = state.tasks.find(t => t.id === id);

      if (task && startStr && endStr) {
        const [sh, sm] = startStr.split(':').map(Number);
        const [eh, em] = endStr.split(':').map(Number);
        const startMins = sh * 60 + sm;
        const endMins = eh * 60 + em;
        task.topMinutes = startMins;
        task.duration = Math.max(15, endMins - startMins);
        renderAll();
      }
      closeTimeEditModal();
    }

    // マトリクス描画（済・予定・ルーティン・カレンダー大枠を厳密除外）
    function renderMatrixView() {
      ['q1', 'q2', 'q3', 'q4'].forEach(q => {
        document.getElementById(`matrixZone${q.toUpperCase()}`).innerHTML = '';
      });
      const tray = document.getElementById('matrixInboxTray');
      tray.innerHTML = '';

      const uniqueTasksMap = new Map();
      
      const filteredTasks = state.tasks.filter(t => {
        const isCompleted = t.completed;
        const isRoutine = t.isRoutine || t.id.startsWith('task_rt_');
        const isCalEvent = t.isCalendarEvent || t.id.startsWith('task_cal_');
        const isPlanLane = t.lane === 'plan';

        return !isCompleted && !isRoutine && !isCalEvent && !isPlanLane;
      });

      filteredTasks.forEach(task => {
        if (!uniqueTasksMap.has(task.title)) {
          uniqueTasksMap.set(task.title, task);
        }
      });

      const uniqueTasks = Array.from(uniqueTasksMap.values());

      uniqueTasks.forEach(task => {
        const card = document.createElement('div');
        card.className = "bg-white p-2 rounded shadow-sm border border-gray-200 text-xs flex justify-between items-center cursor-grab";
        card.dataset.id = task.id;
        card.draggable = true;
        card.addEventListener('dragstart', handleDragStart);

        card.innerHTML = `
          <span class="font-bold truncate text-gray-700">${task.title}</span>
          <div class="flex gap-1">
            <button onclick="setMatrixZoneByTitle('${task.title}', 'q1')" class="px-1 text-[9px] bg-red-100 text-red-700 rounded font-bold">Q1</button>
            <button onclick="setMatrixZoneByTitle('${task.title}', 'q2')" class="px-1 text-[9px] bg-blue-100 text-blue-700 rounded font-bold">Q2</button>
            <button onclick="setMatrixZoneByTitle('${task.title}', 'q3')" class="px-1 text-[9px] bg-amber-100 text-amber-700 rounded font-bold">Q3</button>
            <button onclick="setMatrixZoneByTitle('${task.title}', 'q4')" class="px-1 text-[9px] bg-gray-200 text-gray-700 rounded font-bold">Q4</button>
          </div>
        `;

        if (task.matrixZone && task.matrixZone !== 'none') {
          const zoneEl = document.getElementById(`matrixZone${task.matrixZone.toUpperCase()}`);
          if (zoneEl) zoneEl.appendChild(card);
        } else {
          tray.appendChild(card);
        }
      });
    }

    function setMatrixZoneByTitle(title, zone) {
      state.tasks.forEach(t => {
        if (t.title === title) {
          t.matrixZone = zone;
        }
      });
      renderAll();
    }

    function quickAddMatrixTask(zone) {
      const title = prompt('タスク名を入力してください:');
      if (title) {
        state.tasks.push({
          id: 'task_' + Date.now(),
          title,
          duration: 30,
          category: 'desk',
          matrixZone: zone,
          date: state.currentDateStr,
          lane: 'inbox',
          topMinutes: 540,
          completed: false
        });
        renderAll();
      }
    }

    function openRoutineModal() { renderRoutineList(); document.getElementById('routineModal').style.display = 'flex'; }
    function closeRoutineModal() { document.getElementById('routineModal').style.display = 'none'; }
    
    function selectAllDays(checked) {
      document.querySelectorAll('.rt-day-cb').forEach(cb => cb.checked = checked);
    }

    function handleAddRoutine(e) {
      e.preventDefault();
      const title = document.getElementById('rtTitle').value.trim();
      const startStr = document.getElementById('rtStart').value;
      const endStr = document.getElementById('rtEnd').value;
      const category = document.getElementById('rtCategory').value;

      const selectedDays = Array.from(document.querySelectorAll('.rt-day-cb:checked')).map(cb => parseInt(cb.value, 10));

      if (selectedDays.length === 0) {
        alert('繰り返し曜日を1つ以上選択してください。');
        return;
      }

      const [sh, sm] = startStr.split(':').map(Number);
      const [eh, em] = endStr.split(':').map(Number);
      const startMinutes = sh * 60 + sm;
      const duration = Math.max(15, (eh * 60 + em) - startMinutes);

      state.routines.push({ id: 'rt_' + Date.now(), title, startMinutes, duration, category, days: selectedDays });
      saveData();
      renderRoutineList();
      renderAll();
    }

    function renderRoutineList() {
      const list = document.getElementById('routineList');
      list.innerHTML = '';
      state.routines.forEach(rt => {
        const item = document.createElement('div');
        item.className = "flex justify-between items-center p-2 bg-gray-50 border rounded text-xs";
        
        const days = rt.days || [1, 2, 3, 4, 5];
        const dayStr = days.length === 7 ? '毎日' : days.map(d => DAY_NAMES[d]).join('・');

        item.innerHTML = `
          <div>
            <span class="font-bold text-gray-800">${rt.title}</span>
            <span class="text-[10px] text-gray-500 block">${formatMinutesToTime(rt.startMinutes)} (${rt.duration}分) - [${dayStr}]</span>
          </div>
          <button onclick="deleteRoutine('${rt.id}')" class="text-red-500 hover:text-red-700">削除</button>
        `;
        list.appendChild(item);
      });
    }

    function deleteRoutine(id) {
      state.routines = state.routines.filter(r => r.id !== id);
      saveData();
      renderRoutineList();
    }

    function openSyncModal() {
      document.getElementById('syncKeyInput').value = state.syncKey || '';
      document.getElementById('syncModal').style.display = 'flex';
    }
    function closeSyncModal() { document.getElementById('syncModal').style.display = 'none'; }
    
    function applySyncKey() {
      const key = document.getElementById('syncKeyInput').value.trim();
      if (key) {
        state.syncKey = key;
        localStorage.setItem('ts_sync_key', key);
        connectFirebaseSync(key);
        alert(`同期キー "${key}" に接続しました！`);
      }
      closeSyncModal();
    }

    function renderCalendarView() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';
      const parts = state.currentDateStr.split('-');
      const y = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10) - 1;

      document.getElementById('calendarMonthTitle').textContent = `${y}年 ${m + 1}月`;

      ['日','月','火','水','木','金','土'].forEach(d => {
        const h = document.createElement('div');
        h.className = "bg-gray-50 p-1.5 text-center text-xs font-bold border-r border-b border-gray-200";
        h.textContent = d;
        grid.appendChild(h);
      });

      const firstDay = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = "bg-gray-50/50 border-r border-b border-gray-200 min-h-[70px]";
        grid.appendChild(cell);
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const cell = document.createElement('div');
        cell.className = `p-1 border-r border-b border-gray-200 min-h-[70px] bg-white cursor-pointer hover:bg-blue-50/30 flex flex-col gap-0.5 ${dateStr === getTodayStr() ? 'bg-blue-50/50' : ''}`;
        cell.innerHTML = `<span class="text-[10px] font-bold text-gray-400">${d}</span>`;

        const events = state.calendarEvents.filter(e => e.date === dateStr);
        events.forEach(ev => {
          const pill = document.createElement('div');
          pill.className = "bg-blue-100 text-blue-800 text-[9px] px-1 rounded truncate font-medium";
          pill.textContent = ev.title;
          cell.appendChild(pill);
        });

        cell.onclick = () => {
          state.currentDateStr = dateStr;
          updateDateDisplay();
          switchView('daily');
          renderAll();
        };
        grid.appendChild(cell);
      }
    }

    function openCalendarModal() {
      document.getElementById('calEventDate').value = state.currentDateStr;
      document.getElementById('calendarModal').style.display = 'flex';
    }
    function closeCalendarModal() { document.getElementById('calendarModal').style.display = 'none'; }
    function handleSaveCalendarEvent(e) {
      e.preventDefault();
      const title = document.getElementById('calEventTitle').value.trim();
      const category = document.getElementById('calEventCategory').value;
      const date = document.getElementById('calEventDate').value;
      const startStr = document.getElementById('calEventStart').value;
      const endStr = document.getElementById('calEventEnd').value;

      const [sh, sm] = startStr.split(':').map(Number);
      const [eh, em] = endStr.split(':').map(Number);
      const startMinutes = sh * 60 + sm;
      const duration = Math.max(15, (eh * 60 + em) - startMinutes);

      state.calendarEvents.push({ id: 'cal_' + Date.now(), title, category, date, startMinutes, duration });
      saveData();
      closeCalendarModal();
      renderAll();
    }

    function selectTask(id) {
      state.selectedTaskId = id;
      document.getElementById('quickActionBar').style.display = 'flex';
    }
    function closeQuickAction() {
      state.selectedTaskId = null;
      document.getElementById('quickActionBar').style.display = 'none';
      const pop = document.getElementById('activeCategoryPickerPopover');
      if (pop) pop.remove();
    }

    function quickEditTitle() {
      if (!state.selectedTaskId) return;
      const task = state.tasks.find(t => t.id === state.selectedTaskId);
      if (!task) return;

      const newTitle = prompt('新しいタスク名を入力してください:', task.title);
      if (newTitle && newTitle.trim() !== '') {
        task.title = newTitle.trim();
        renderAll();
      }
    }

    function quickToggleCategoryPicker() {
      if (!state.selectedTaskId) return;
      const existing = document.getElementById('activeCategoryPickerPopover');
      if (existing) { existing.remove(); return; }

      const card = document.querySelector(`[data-id="${state.selectedTaskId}"]`);
      if (!card) return;

      const popover = document.createElement('div');
      popover.id = 'activeCategoryPickerPopover';
      popover.className = 'absolute top-full mt-1 right-0 bg-white border border-gray-200 rounded-lg p-2 shadow-xl flex flex-col gap-1 z-50 w-32';

      Object.keys(CATEGORY_MAP).forEach(catKey => {
        const cat = CATEGORY_MAP[catKey];
        const btn = document.createElement('button');
        btn.className = `text-left px-2 py-1 rounded text-xs hover:bg-gray-100 flex items-center gap-1 ${cat.color}`;
        btn.innerHTML = `${cat.icon} ${cat.label}`;
        btn.onclick = (e) => {
          e.stopPropagation();
          changeTaskCategory(state.selectedTaskId, catKey);
          popover.remove();
        };
        popover.appendChild(btn);
      });

      card.appendChild(popover);
    }

    function changeTaskCategory(taskId, category) {
      const task = state.tasks.find(t => t.id === taskId);
      if (task) {
        task.category = category;
        renderAll();
      }
    }

    function quickResize(delta) {
      if (!state.selectedTaskId) return;
      const t = state.tasks.find(x => x.id === state.selectedTaskId);
      if (t) { t.duration = Math.max(15, t.duration + delta); renderAll(); }
    }
    function quickDuplicate() {
      if (!state.selectedTaskId) return;
      const t = state.tasks.find(x => x.id === state.selectedTaskId);
      if (t) {
        const copy = JSON.parse(JSON.stringify(t));
        copy.id = 'task_' + Date.now();
        state.tasks.push(copy);
        renderAll();
      }
      closeQuickAction();
    }
    function quickDelete() {
      if (state.selectedTaskId) { deleteTask(state.selectedTaskId); closeQuickAction(); }
    }
    function openTimeEditModalForSelected() {
      if (state.selectedTaskId) openTimeEditModal(state.selectedTaskId);
    }

    function initResize(e, taskId) {
      e.stopPropagation();
      e.preventDefault();
      const task = state.tasks.find(t => t.id === taskId);
      if (!task) return;
      const startY = e.clientY;
      const startDur = task.duration;

      function onMouseMove(mv) {
        const deltaMins = Math.round((mv.clientY - startY) / SLOT_HEIGHT) * 15;
        task.duration = Math.max(15, startDur + deltaMins);
        renderAll();
      }
      function onMouseUp() {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('mouseup', onMouseUp);
      }
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mouseup', onMouseUp);
    }

    function calculateTotals() {
      const todayTasks = state.tasks.filter(t => t.date === state.currentDateStr);
      const planMins = todayTasks.filter(t => t.lane === 'plan').reduce((s, t) => s + t.duration, 0);
      const actMins = todayTasks.filter(t => t.lane === 'actual').reduce((s, t) => s + t.duration, 0);

      document.getElementById('planTotal').textContent = `${Math.floor(planMins/60)}h ${planMins%60}m`;
      document.getElementById('actTotal').textContent = `${Math.floor(actMins/60)}h ${actMins%60}m`;
    }
  </script>
</body>
</html>
